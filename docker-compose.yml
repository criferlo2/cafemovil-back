services:
  api:
    build: .
    container_name: cafemovil-api
    environment:
      PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: cafemovil
      DB_USER: cafemovil
      DB_PASSWORD: cafemovil
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: cafemovil-mysql
    environment:
      MYSQL_DATABASE: cafemovil
      MYSQL_USER: cafemovil
      MYSQL_PASSWORD: cafemovil
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - cafemovil_mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cafemovil_mysql_data:
